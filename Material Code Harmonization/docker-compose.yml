services:
  postgres:
    image: postgres:16-alpine
    container_name: numm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: material_master
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # WP0/I-01: use 5433 to avoid collision with a native Postgres install
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d material_master"]
      interval: 5s
      timeout: 5s
      retries: 5

  matching-service:
    build:
      context: ./matching-service
      dockerfile: Dockerfile
    container_name: numm-matching-service
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./material-master-backend
      dockerfile: Dockerfile
    container_name: numm-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      matching-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/material_master
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      MATCHING_SERVICE_URL: http://matching-service:5000
      SPRING_PROFILES_ACTIVE: python-matching,demo
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    # WP0/I-02: backend healthcheck via actuator
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: numm-frontend
    restart: unless-stopped
    depends_on:
      backend:
        # WP0/I-02: wait for backend to be healthy before starting nginx
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
