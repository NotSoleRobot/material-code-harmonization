# --- Database connection ---
# Update these to match your local PostgreSQL setup.
spring.datasource.url=jdbc:postgresql://localhost:5433/material_master
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# 'update' auto-adjusts tables to match entities - convenient for dev,
# but NOT how CHECK constraints / partial unique indexes get created (see schema.sql note).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- schema.sql execution ---
# By default Spring Boot won't run schema.sql against a "real" database
# (only against in-memory test DBs) unless told to explicitly.
spring.sql.init.mode=always
# Ensures Hibernate creates/updates tables FIRST, then schema.sql runs -
# otherwise schema.sql's ALTER TABLE "user" would fail on a table that
# doesn't exist yet.
spring.jpa.defer-datasource-initialization=true

# --- Server ---
server.port=8080
