server.forward-headers-strategy=framework
server.error.include-message=never
spring.jpa.open-in-view=false
jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# Supabase's shared session pool is deliberately small on the free tier. Keep
# each Render instance lean so an old/new deploy overlap cannot reserve every
# database session, and let Flyway wait for a retiring instance to release one.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:2}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.connection-timeout=15000
spring.flyway.connect-retries=12
spring.flyway.connect-retries-interval=5s

app.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:admin@numm.gov.in}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.disable-seeded-accounts=${DISABLE_SEEDED_ROLE_ACCOUNTS_V2:false}
