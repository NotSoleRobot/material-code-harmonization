# --- Database connection (Environment-driven with local defaults) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/material_master}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings (W9.7)
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# --- Flyway Database Migrations (W10 / V1, V2) ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=32

# --- JWT Authentication (W1) ---
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=86400000

# --- Active Profiles & Matching Microservice Settings (W9.7) ---
spring.profiles.active=${SPRING_PROFILES_ACTIVE:python-matching}
matching.service.url=${MATCHING_SERVICE_URL:http://localhost:5000}
matching.service.token=${MATCHING_SERVICE_TOKEN:}
matching.service.connect-timeout-ms=5000
matching.service.read-timeout-ms=60000

# --- Multipart File Ingestion (FR11) ---
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# --- Server ---
server.port=${PORT:8080}
server.error.include-message=always

# --- Actuator (WP0/I-03) — only health, nothing else ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- CORS (WP0) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
