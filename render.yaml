services:
  - type: web
    name: numm-frontend
    runtime: static
    rootDir: Material Code Harmonization/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      # V2 deliberately supersedes any stale VITE_API_BASE_URL value that was
      # entered manually when the Blueprint was first created.
      - key: VITE_API_BASE_URL_V2
        fromService:
          type: web
          name: numm-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: numm-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

  - type: web
    name: numm-matching
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Material Code Harmonization/matching-service/Dockerfile
    dockerContext: ./Material Code Harmonization/matching-service
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: 10000
      - key: MATCHING_SERVICE_TOKEN
        generateValue: true
    buildFilter:
      paths:
        - Material Code Harmonization/matching-service/**

  - type: web
    name: numm-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Material Code Harmonization/material-master-backend/Dockerfile
    dockerContext: ./Material Code Harmonization/material-master-backend
    healthCheckPath: /actuator/health
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: 10000
      - key: SPRING_PROFILES_ACTIVE
        value: python-matching,hosted,demo
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # V2 supersedes the manually entered URL from the first deployment.
      - key: MATCHING_SERVICE_URL_V2
        fromService:
          type: web
          name: numm-matching
          envVarKey: RENDER_EXTERNAL_URL
      - key: MATCHING_SERVICE_URL
        fromService:
          type: web
          name: numm-matching
          envVarKey: RENDER_EXTERNAL_URL
      - key: MATCHING_SERVICE_TOKEN
        fromService:
          type: web
          name: numm-matching
          envVarKey: MATCHING_SERVICE_TOKEN
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 28800000
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGINS_V2
        fromService:
          type: web
          name: numm-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: admin@numm.gov.in
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: DISABLE_SEEDED_ROLE_ACCOUNTS_V2
        value: false
    buildFilter:
      paths:
        - Material Code Harmonization/material-master-backend/**
